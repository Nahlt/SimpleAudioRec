name: Build Windows

# Compila la versione portabile su un server Windows di GitHub.
# - a ogni push sul ramo main e manualmente (Actions > Build Windows > Run workflow):
#   l'eseguibile si scarica da "Artifacts" in fondo alla pagina dell'esecuzione;
# - quando si crea un tag v* (es. v0.1.0): viene anche pubblicata una Release con lo zip.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test -p simpleaudiorec_core

      - name: Build
        run: cargo build --release -p simpleaudiorec

      - name: Pacchetto
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME } else { "main-$($env:GITHUB_SHA.Substring(0,7))" }
          $dir = "dist/SimpleAudioRec"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item target/release/SimpleAudioRec.exe, LEGGIMI.txt, README.txt, LICENSE, THIRD_PARTY_NOTICES.txt $dir
          Compress-Archive -Path "$dir/*" -DestinationPath "dist/SimpleAudioRec-$ver-win64.zip" -Force
          Get-ChildItem dist -Recurse | Format-Table Name, Length

      - name: Pubblica il pacchetto (Artifacts)
        uses: actions/upload-artifact@v6
        with:
          name: SimpleAudioRec-win64
          path: dist/SimpleAudioRec/
          retention-days: 30

      - name: Allega lo zip alla Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
