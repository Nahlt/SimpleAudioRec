[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Nahlt/SimpleAudioRec"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

# I test del mixer simulano minuti di audio: compilati ottimizzati restano rapidi.
[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
