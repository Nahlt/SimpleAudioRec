[package]
name = "simpleaudiorec"
description = "Registra l'audio del PC (output + microfono) durante i meeting"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "SimpleAudioRec"
path = "src/main.rs"

[dependencies]
simpleaudiorec_core = { path = "../core" }
chrono = "0.4.45"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.37.0"
global-hotkey = "0.9.0"
log = "0.4.35"
raw-window-handle = "0.6.2"
rfd = "0.17.2"
sys-locale = "0.3.2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(windows)'.dependencies]
# richiesto dalla macro #[implement] di windows-rs
windows-core = "0.62.2"

[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11"] }

[build-dependencies]
winresource = "0.1"
